name: Deploy UE0 + UE1 to GitHub Pages

# Ein gemeinsamer Workflow für beide Frontends, weil GH Pages nur EIN
# Artefakt pro Repo akzeptiert. Vorher hatten UE0 und UE1 eigene
# Workflows, was dazu führte, dass der zuletzt laufende Workflow den
# anderen Frontend-Stand vom Pages-Site überschrieben hat (404 für den
# älteren). Jetzt baut ein Job beide Frontends und packt sie ins
# gleiche _site-Verzeichnis.

on:
  # Plan 2026-05-25 Phase 0 Task 0.2: Push-Trigger PAUSIERT für Multi-FB-Umbau.
  # UE0 + UE1 werden neu gebaut, alte Live-Demos sollen während Umbau nicht
  # automatisch überschrieben werden. Reaktivierung in Plan Task 8.5.
  # push:
  #   branches: [main]
  #   paths:
  #     - "ue0/upload-portal/**"
  #     - "ue1/webformular/**"
  #     - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ── UE0: Upload-Portal ────────────────────────────────────────
      - name: UE0 — install
        working-directory: ue0/upload-portal
        run: npm ci
      - name: UE0 — build
        working-directory: ue0/upload-portal
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: UE0 — pack into _site
        run: |
          mkdir -p _site/ue0/upload-portal
          cp -r ue0/upload-portal/dist/* _site/ue0/upload-portal/

      # ── UE1: Webformular ──────────────────────────────────────────
      - name: UE1 — install
        working-directory: ue1/webformular
        run: npm ci
      - name: UE1 — build
        working-directory: ue1/webformular
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: UE1 — pack into _site
        run: |
          mkdir -p _site/ue1/webformular
          cp -r ue1/webformular/dist/* _site/ue1/webformular/

      # ── Landing-Page mit Links zu beiden ──────────────────────────
      - name: Root index.html
        run: |
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="de"><head>
            <meta charset="UTF-8">
            <title>DigitalisierungVerwaltung — Demo-Frontends</title>
            <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:3rem auto;padding:0 1rem;line-height:1.6}h1{border-bottom:2px solid #AD0E36;padding-bottom:.4rem}a{color:#AD0E36}</style>
          </head><body>
            <h1>Stadt Würzburg — Altenhilfeplan APL 2 (Demo THWS)</h1>
            <p><strong>⚠ Demo für Lehrzwecke.</strong> Kein offizielles Angebot der Stadt Würzburg.</p>
            <ul>
              <li><a href="ue0/upload-portal/">UE0 — PDF-Upload-Portal (Reifegradstufe 0)</a></li>
              <li><a href="ue1/webformular/">UE1 — Online-Webformular (Reifegradstufe 1)</a></li>
            </ul>
            <p style="margin-top:2rem;font-size:.9em;color:#666">
              <a href="https://github.com/swrobuts/DigitalisierungVerwaltung">Quellcode auf GitHub</a>
            </p>
          </body></html>
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
