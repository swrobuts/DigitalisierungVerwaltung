name: Deploy UE0 to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ue0/upload-portal/**"
      - ".github/workflows/deploy-ue0.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Wichtig: UE0 und UE1 teilen sich die Pages-Group, damit nicht beide
# parallel deployen und sich gegenseitig die _site-Artefakte überschreiben.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ue0/upload-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ue0/upload-portal/package-lock.json
      - run: npm ci
      - name: Build mit Supabase-Env (Secrets aus GitHub Repo-Settings)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - name: Wrap dist in /ue0/upload-portal/ for Pages routing
        run: |
          mkdir -p ../../_site/ue0/upload-portal
          cp -r dist/* ../../_site/ue0/upload-portal/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
