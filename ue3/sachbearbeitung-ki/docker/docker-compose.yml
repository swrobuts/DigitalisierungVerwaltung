services:
  amt-ki-frontend:
    container_name: amt-ki-frontend
    build:
      # Build-Context = Repo-Root, weil der Dockerfile auf
      # packages/data-layer + packages/foerderbereiche zugreift
      # (pnpm-Workspaces).
      context: ../../..
      dockerfile: ue3/sachbearbeitung-ki/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://supabase.butscher.cloud}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_AUTH_REDIRECT: ${VITE_AUTH_REDIRECT:-https://amt-ki.butscher.cloud/auth/callback}
    image: amt-ki-frontend:latest
    restart: unless-stopped
    networks:
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default

      # HTTP → HTTPS Redirect (beide Hosts)
      - traefik.http.routers.amt-ki-http.rule=Host(`amt-ki.butscher.cloud`) || Host(`ki.butscher.cloud`)
      - traefik.http.routers.amt-ki-http.entrypoints=web
      - traefik.http.routers.amt-ki-http.middlewares=amt-ki-https-redirect
      - traefik.http.middlewares.amt-ki-https-redirect.redirectscheme.scheme=https

      # HTTPS-Router (amt-ki = backward-compat, ki = neuer Multi-FB-Name)
      - traefik.http.routers.amt-ki.rule=Host(`amt-ki.butscher.cloud`) || Host(`ki.butscher.cloud`)
      - traefik.http.routers.amt-ki.entrypoints=websecure
      - traefik.http.routers.amt-ki.tls=true
      - traefik.http.routers.amt-ki.tls.certresolver=mytlschallenge
      - traefik.http.routers.amt-ki.service=amt-ki

      - traefik.http.services.amt-ki.loadbalancer.server.port=8080

      # Security-Header
      - traefik.http.routers.amt-ki.middlewares=amt-ki-secheaders
      - traefik.http.middlewares.amt-ki-secheaders.headers.stsSeconds=31536000
      - traefik.http.middlewares.amt-ki-secheaders.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.amt-ki-secheaders.headers.framedeny=true

networks:
  root_default:
    external: true
