[project]
name = "pruefung"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "anthropic>=0.39",
  "pydantic[email]>=2.9",
  "httpx>=0.27",
  "json-logic-qubit>=0.9",
  "pypdfium2>=4.30",
  "weasyprint>=63",
  "jinja2>=3.1",
  "pytesseract>=0.3",
  "Pillow>=10",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
