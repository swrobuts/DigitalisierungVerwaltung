services:
  pruefung-service:
    container_name: pruefung-service
    build:
      context: ..
      dockerfile: Dockerfile
    image: pruefung-service:latest
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY}
      # LLM-Provider-Switch: 'anthropic' (default) oder 'lmstudio' für lokales
      # Modell. Bei 'lmstudio' zusätzlich LMSTUDIO_BASE_URL setzen (z.B.
      # http://host.docker.internal:1234/v1, damit der Container den Host
      # erreicht).
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      LMSTUDIO_BASE_URL: ${LMSTUDIO_BASE_URL:-http://host.docker.internal:1234/v1}
      LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-local-model}
      AHP_PDF_PATH: /app/materialien/foerderrichtlinie-ahp-2025-03-27.pdf
    volumes:
      - /opt/pruefung/materialien:/app/materialien:ro
    networks:
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      # HTTP → HTTPS Redirect
      - traefik.http.routers.pruefung-http.rule=Host(`pruefung.butscher.cloud`)
      - traefik.http.routers.pruefung-http.entrypoints=web
      - traefik.http.routers.pruefung-http.middlewares=pruefung-https-redirect
      - traefik.http.middlewares.pruefung-https-redirect.redirectscheme.scheme=https
      # HTTPS-Router
      - traefik.http.routers.pruefung.rule=Host(`pruefung.butscher.cloud`)
      - traefik.http.routers.pruefung.entrypoints=websecure
      - traefik.http.routers.pruefung.tls=true
      - traefik.http.routers.pruefung.tls.certresolver=mytlschallenge
      - traefik.http.routers.pruefung.service=pruefung
      - traefik.http.services.pruefung.loadbalancer.server.port=8000
      # Rate-Limit (Kosten-Schutz Anthropic-API): max ~6 Chat-Turns/min/IP, Burst 12
      - traefik.http.routers.pruefung.middlewares=pruefung-ratelimit
      - traefik.http.middlewares.pruefung-ratelimit.ratelimit.average=6
      - traefik.http.middlewares.pruefung-ratelimit.ratelimit.burst=12
      - traefik.http.middlewares.pruefung-ratelimit.ratelimit.period=1m

networks:
  root_default:
    external: true
